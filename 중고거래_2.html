<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>캠퍼스 중고 마트</title>
    <style>
        /* 기본 스타일 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f6f7;
            color: #333;
        }

        /* 헤더 스타일 */
        header {
            background-color: #4A90E2;
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: relative;
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        header p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        /* 로그인 버튼 상단 배치 */
        .login-btn {
            position: absolute;
            top: 25px;
            right: 30px;
            background-color: transparent;
            color: white;
            border: 2px solid white;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .login-btn:hover {
            background-color: white;
            color: #4A90E2;
        }

        /* 메인 컨테이너 */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* 카테고리 탭 */
        .category-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .tab {
            background-color: white;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #ddd;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .tab.active, .tab:hover {
            background-color: #4A90E2;
            color: white;
            border-color: #4A90E2;
        }

        /* 상품 목록 그리드 */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
        }

        /* 상품 카드 스타일 */
        .product-card {
            background-color: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }

        .product-image {
            width: 100%;
            height: 200px;
            background-color: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #adb5bd;
            font-weight: bold;
        }

        /* 카테고리별 이미지 배경색 */
        .product-card[data-category="전자기기"] .product-image { background-color: #d1ecf1; color: #0c5460; }
        .product-card[data-category="전공책"] .product-image { background-color: #d4edda; color: #155724; }
        .product-card[data-category="필기구"] .product-image { background-color: #fff3cd; color: #856404; }

        .product-info {
            padding: 15px;
        }

        .category-badge {
            display: inline-block;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .badge-electronic { background-color: #e3f2fd; color: #0d47a1; }
        .badge-book { background-color: #e8f5e9; color: #1b5e20; }
        .badge-pencil { background-color: #fffde7; color: #f57f17; }

        .product-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 5px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .product-price {
            font-size: 1.2rem;
            font-weight: bold;
            color: #222;
            margin-bottom: 10px;
        }

        .product-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #888;
            border-top: 1px solid #f0f0f0;
            padding-top: 10px;
        }

        /* ==========================================================
           로그인 모달 (Login Modal) 스타일
        ============================================================ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        /* 모달이 활성화되었을 때 클래스 */
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background-color: white;
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
            transform: translateY(-20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-box {
            transform: translateY(0);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5rem;
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
        }

        .close-btn:hover {
            color: #333;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 25px;
            color: #4A90E2;
        }

        /* 로그인 폼 입력창 */
        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #4A90E2;
        }

        /* 로그인 버튼 */
        .submit-btn {
            width: 100%;
            background-color: #4A90E2;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .submit-btn:hover {
            background-color: #357ABD;
        }

        .modal-footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.85rem;
            color: #888;
        }

        .modal-footer a {
            color: #4A90E2;
            text-decoration: none;
            margin: 0 5px;
        }

        /* 모바일 대응 버튼 위치 조정 */
        @media (max-width: 600px) {
            .login-btn {
                position: static;
                display: block;
                margin: 10px auto 0 auto;
            }
        }
    </style>
</head>
<body>

    <!-- 상단 헤더 -->
    <header>
        <h1>🎓 캠퍼스 중고 마트</h1>
        <p>우리 학교 학생들을 위한 안전한 중고거래 공간</p>
        <!-- 로그인 버튼 추가 -->
        <button class="login-btn" id="openLogin">로그인</button>
    </header>

    <div class="container">
        <!-- 카테고리 필터 탭 -->
        <div class="category-tabs">
            <div class="tab active">전체보기</div>
            <div class="tab">전자기기</div>
            <div class="tab">전공책</div>
            <div class="tab">필기구</div>
        </div>

        <!-- 중고 물품 리스트 영역 -->
        <div class="product-grid">
            <!-- 전자기기 아이템 -->
            <div class="product-card" data-category="전자기기">
                <div class="product-image">💻 전자기기 이미지</div>
                <div class="product-info">
                    <span class="category-badge badge-electronic">전자기기</span>
                    <h3 class="product-title">아이패드 에어 5세대 Wifi 64GB</h3>
                    <div class="product-price">550,000원</div>
                    <div class="product-meta"><span>방금 전</span><span>공학관 앞</span></div>
                </div>
            </div>

            <!-- 전공책 아이템 -->
            <div class="product-card" data-category="전공책">
                <div class="product-image">📚 전공책 이미지</div>
                <div class="product-info">
                    <span class="category-badge badge-book">전공책</span>
                    <h3 class="product-title">컴퓨터 구조 및 설계 (개정 6판)</h3>
                    <div class="product-price">25,000원</div>
                    <div class="product-meta"><span>10분 전</span><span>도서관 로비</span></div>
                </div>
            </div>

            <!-- 필기구 아이템 -->
            <div class="product-card" data-category="필기구">
                <div class="product-image">✏️ 필기구 이미지</div>
                <div class="product-info">
                    <span class="category-badge badge-pencil">필기구</span>
                    <h3 class="product-title">애플펜슬 2세대 (거의 새것)</h3>
                    <div class="product-price">90,000원</div>
                    <div class="product-meta"><span>30분 전</span><span>학생회관</span></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ==========================================================
       로그인 창 모달 HTML 구조 추가
    ============================================================ */ -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <button class="close-btn" id="closeLogin">&times;</button>
            <div class="modal-title">학교 계정 로그인</div>
            
            <form id="loginForm">
                <div class="input-group">
                    <label for="userId">학교 이메일 또는 아이디</label>
                    <input type="text" id="userId" placeholder="example@university.ac.kr" required>
                </div>
                <div class="input-group">
                    <label for="userPw">비밀번호</label>
                    <input type="password" id="userPw" placeholder="비밀번호를 입력하세요" required>
                </div>
                <button type="submit" class="submit-btn">로그인하기</button>
            </form>

            <div class="modal-footer">
                <a href="#">아이디 찾기</a> | <a href="#">비밀번호 찾기</a> | <a href="#">회원가입</a>
            </div>
        </div>
    </div>

    <script>
        // 1. 카테고리 필터링 기능
        const tabs = document.querySelectorAll('.tab');
        const cards = document.querySelectorAll('.product-card');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');

                const category = tab.textContent;

                cards.forEach(card => {
                    if (category === '전체보기' || card.getAttribute('data-category') === category) {
                        card.style.display = 'block';
                    } else {
                        card.style.display = 'none';
                    }
                });
            });
        });

        // 2. 로그인 모달 제어 기능 추가
        const openLoginBtn = document.getElementById('openLogin');
        const closeLoginBtn = document.getElementById('closeLogin');
        const loginModal = document.getElementById('loginModal');
        const loginForm = document.getElementById('loginForm');

        // 로그인 버튼 누르면 켜기
        openLoginBtn.addEventListener('click', () => {
            loginModal.classList.add('active');
        });

        // X 버튼 누르면 끄기
        closeLoginBtn.addEventListener('click', () => {
            loginModal.classList.remove('active');
        });

        // 모달 바깥 어두운 배경 누르면 끄기
        loginModal.addEventListener('click', (e) => {
            if (e.target === loginModal) {
                loginModal.classList.remove('active');
            }
        });

        // 로그인 폼 제출 시 이벤트 (테스트용 알림)
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault(); // 페이지 새로고침 방지
            const idValue = document.getElementById('userId').value;
            alert(`${idValue}님 환영합니다! (로그인 구현 성공)`);
            loginModal.classList.remove('active'); // 로그인 후 창 닫기
        });
    </script>
</body>
</html>
